# 🧪 CI — Tests automáticos (Mejora 1: red de seguridad para cada cambio)
# Corre pytest en cada push/PR y marca el commit con ✅ o ❌.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de test
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        run: pytest tests/ -q

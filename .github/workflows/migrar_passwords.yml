name: Migrar Passwords a SHA-256

# Solo se ejecuta cuando tú lo activas manualmente
# No corre solo ni con cada push
on:
  workflow_dispatch:

jobs:
  migrar:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repo
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      # 2. Instala Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Instala las dependencias necesarias
      - name: Instalar dependencias
        run: pip install supabase

      # 4. Ejecuta el script (inyecta los secrets como variables de entorno)
      - name: Ejecutar migración
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python migrar_passwords.py
